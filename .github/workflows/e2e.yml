name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Start services via Docker Compose
        run: |
          docker compose up -d --build

      - name: Wait for Repub server to be ready
        run: |
          echo "Waiting for repub to be healthy..."
          attempt=1
          max_attempts=30
          
          while [ $attempt -le $max_attempts ]; do
            if curl -sf http://localhost:4920/health > /dev/null 2>&1; then
              echo "Repub server is ready!"
              exit 0
            fi
            
            echo "Waiting (attempt $attempt/$max_attempts)..."
            sleep 2
            attempt=$((attempt + 1))
          done
          
          echo "Timed out waiting for repub to be healthy."
          docker compose logs repub
          exit 1

      - name: Run Smoke Test Script
        run: |
          ./scripts/smoke_test.sh

      - name: Dump Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Teardown
        if: always()
        run: docker compose down -v
